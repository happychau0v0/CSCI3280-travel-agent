server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy application routes and SSE traffic to the backend container.
    location ~ ^/(chat|status|photo|speech|export|visa|airports|itinerary|geo) {
        proxy_pass         http://backend:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;

        # Required for SSE (Server-Sent Events): disable buffering so
        # partial_itinerary / tool_start / done events stream in real-time.
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 120s;
    }

    # React SPA — serve index.html for all unknown paths (client-side routing)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
