# ─── Chat role — single-airport shortcut (Singapore → SIN) ────────────────

- id: chat-plan-singapore-single-airport
  call_role: chat
  user_message: |
    Plan a 5-day trip to Singapore starting 2026-06-01 ending 2026-06-05.
    Transport: plane.
  context:
    user_location: Hong Kong
    today: "2026-04-17"
    expects_single_airport: true
