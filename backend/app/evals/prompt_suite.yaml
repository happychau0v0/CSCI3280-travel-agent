# Eval prompt suite — seed user messages + applicable rubric IDs.
#
# Each entry is one scenario the eval_runner will execute via chat(), then
# score with the listed rubrics. Rubric IDs mirror docs/llm-spec.md.
#
# Not committed golden data — safe to add/remove prompts as we discover
# new failure modes.
#
# To run: python -m app.evals.eval_runner --suite=prompt_suite.yaml

# ─── Plan role — happy path ────────────────────────────────────────────────

- id: plan-hkg-nrt-specific-dates
  call_role: plan
  user_message: |
    Plan a 3-day trip from Hong Kong International Airport (HKG) to Tokyo Narita (NRT).
    START DATE: 2026-05-15. END DATE: 2026-05-17.
    Transport: plane. Party: 2 people. Interests: food, temples.
    Flight cabin: economy. Use search_flights with seat_class="economy".
  context:
    user_location: Hong Kong
    today: "2026-04-17"
  rubrics:
    - R-G-004     # prose outside json
    - R-G-005     # no markdown
    - R-G-006     # no bullets
    - R-G-007     # LLM-judge: no tool-call narration
    - R-G-015     # subtitle length
    - R-PLAN-004  # must call search_flights + geocode_city

# ─── Plan role — country destination should clarify ────────────────────────

- id: plan-country-destination-triggers-clarification
  call_role: plan
  user_message: |
    Plan a trip to Japan.
    START DATE: 2026-06-01. END DATE: 2026-06-07.
    Transport: plane. Party: 1.
  context:
    user_location: Hong Kong
    today: "2026-04-17"
    expects_clarification: true
  rubrics:
    - R-PLAN-002  # country → request_input
    - R-G-005     # no markdown

# ─── Plan role — missing dates should stop ─────────────────────────────────

- id: plan-missing-date-stops
  call_role: plan
  user_message: |
    Plan a trip from Hong Kong International Airport (HKG) to Tokyo Narita (NRT).
    START DATE: [not set]. END DATE: [not set].
    Transport: plane. Party: 2.
  context:
    user_location: Hong Kong
    today: "2026-04-17"
    expects_clarification: true
  rubrics:
    - R-PLAN-002  # reuses the request_input detection
    - R-G-005

# ─── Hotels role — happy path ──────────────────────────────────────────────

- id: hotels-tokyo-after-ana
  call_role: hotels
  user_message: |
    Selected flight: ANA NH821, 08:00 HKG → 13:15 NRT, HK$1,950.
    Destination: Tokyo (35.6895, 139.6917). Dates: 2026-05-15 to 2026-05-17.
    Party: 2. Interests: food, temples. Budget: moderate.
    Find hotels near the city centre.
  context:
    user_location: Hong Kong
    today: "2026-04-17"
    flight_to_lat: 35.6895
    flight_to_lng: 139.6917
  rubrics:
    - R-G-001        # hotel names must appear in search_places results
    - R-G-002        # transport tool-first
    - R-G-003        # weather tool-first
    - R-G-004
    - R-G-005
    - R-G-015
    - R-HOTELS-002   # hotel coords within 80 km of flight destination
    - R-HOTELS-003   # must call search_places when hotels returned

# ─── Day-detail role — single-day planner (one day, no flight/hotels) ─────

- id: day-detail-tokyo-day2
  call_role: day_detail
  user_message: |
    Plan DAY 2 only — Tokyo. Date: 2026-05-16. Transport: TRANSIT.
    Hotel base: Park Hyatt Tokyo (35.6858, 139.6908).
    Theme: Shibuya & Harajuku. Suggested areas: Shibuya, Harajuku, Omotesando.
    Party: 2. Interests: food, fashion. Full day 09:00-21:00.
  context:
    user_location: Hong Kong
    today: "2026-04-17"
  rubrics:
    - R-DETAIL-006   # exactly one day in output
    - R-G-004
    - R-G-005
    - R-G-015

# ─── Days role — full days output, no flight/hotels re-emit ────────────────

- id: days-tokyo-full-trip
  call_role: days
  user_message: |
    Selected hotel: Park Hyatt Tokyo (35.6858, 139.6908), check-in 15:00.
    Flight: ANA NH821 arrives NRT 13:15 on 2026-05-15; returns NRT→HKG 17:00 on 2026-05-17.
    Dates: 2026-05-15 to 2026-05-17 (3 days). Party: 2. Interests: food, temples. Transport: TRANSIT.
    Generate the full 3-day activity plan.
  context:
    user_location: Hong Kong
    today: "2026-04-17"
  rubrics:
    - R-DAYS-012   # no re-emit of flight or hotels
    - R-G-001      # every place name must appear in search_places results
    - R-G-002
    - R-G-003
    - R-G-004
    - R-G-007      # LLM-judge: no tool-call narration

# ─── Themes role — day 1 / last-day timing awareness ──────────────────────

- id: themes-tokyo-flight-aware
  call_role: day_themes
  user_message: |
    Assign themes to this 4-day Tokyo trip (2026-05-15 to 2026-05-18).
    Day 1 arrival_time: 14:50. Day 4 departure_time: 17:00.
    Transport: TRANSIT. Party: 2. Interests: food, history, shopping.
  context:
    user_location: Hong Kong
    today: "2026-04-17"
  rubrics:
    - R-THEMES-004   # LLM-judge: day 1 / last-day themes fit flight timing

# ─── Plan role — text-question discipline ──────────────────────────────────

- id: plan-prose-discipline-requires-request-input
  call_role: plan
  user_message: |
    Plan a 4-day trip from Hong Kong (HKG) to Tokyo Narita (NRT).
    START DATE: 2026-06-01. END DATE: 2026-06-04.
    Transport: plane. Party: 1. Interests: ramen, shrines. Cabin: economy.
  context:
    user_location: Hong Kong
    today: "2026-04-17"
  rubrics:
    - R-PLAN-003   # no text-only questions; use request_input
    - R-PLAN-004   # must call search_flights + geocode_city

